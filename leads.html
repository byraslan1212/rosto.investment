<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الليدز — فرصة استثمارية</title>
<style>
  :root{--gold:#D4AF37;--black:#0A0A0A;--dark2:#141414;--white:#f5f5f5;--muted:#999;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--black);color:var(--white);font-family:'Cairo',Arial,sans-serif;padding:24px;}
  h1{color:var(--gold);font-size:22px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px;}

  /* Password gate */
  #gate{max-width:360px;margin:80px auto;text-align:center;}
  #gate input{width:100%;padding:14px;border-radius:8px;border:1px solid #333;background:var(--dark2);color:#fff;font-size:15px;margin-bottom:12px;}
  #gate button{width:100%;padding:14px;border-radius:8px;border:none;background:var(--gold);color:#141414;font-weight:bold;font-size:15px;cursor:pointer;}
  #gate .err{color:#e05555;font-size:13px;margin-top:10px;display:none;}

  /* Dashboard */
  #dashboard{display:none;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .count{background:var(--dark2);border:1px solid #2a2a2a;border-right:4px solid var(--gold);padding:8px 16px;border-radius:8px;font-size:14px;}
  button.refresh{background:var(--dark2);border:1px solid #333;color:var(--gold);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;}
  table{width:100%;border-collapse:collapse;background:var(--dark2);border-radius:10px;overflow:hidden;font-size:13.5px;}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #262626;}
  th{background:#181818;color:var(--gold);font-size:12.5px;position:sticky;top:0;}
  tr:hover td{background:#1c1c1c;}
  td a{color:var(--gold);text-decoration:none;}
  #empty,#loading{text-align:center;color:var(--muted);padding:40px;display:none;}
  @media (max-width:700px){
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tr{background:var(--dark2);margin-bottom:12px;border-radius:8px;border-right:4px solid var(--gold);padding:8px 12px;}
    td{border:none;padding:6px 0;display:flex;justify-content:space-between;gap:10px;}
    td::before{content:attr(data-label);color:var(--muted);font-size:11.5px;}
  }
</style>
</head>
<body>

  <div id="gate">
    <h1>🔒 لوحة الليدز</h1>
    <div class="sub">أدخل كلمة السر للمتابعة</div>
    <input type="password" id="pwd" placeholder="كلمة السر">
    <button onclick="checkPwd()">دخول</button>
    <div class="err" id="gateErr">كلمة السر غلط</div>
  </div>

  <div id="dashboard">
    <h1>📋 الليدز المسجلة</h1>
    <div class="sub">كل الأشخاص اللي سجلوا اهتمامهم من صفحة الاستثمار</div>

    <div class="toolbar">
      <div class="count" id="countBox">جاري التحميل...</div>
      <button class="refresh" onclick="loadLeads()">↻ تحديث</button>
    </div>

    <div id="loading">بيتم تحميل البيانات...</div>
    <div id="empty">لسه مفيش ليدز اتسجلوا</div>

    <table id="leadsTable" style="display:none;">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>الاسم</th>
          <th>الهاتف</th>
          <th>الإيميل</th>
          <th>المدينة</th>
          <th>عدد الوحدات</th>
          <th>ملاحظات</th>
        </tr>
      </thead>
      <tbody id="leadsBody"></tbody>
    </table>
  </div>

<script>
  // !! غيّر السطرين دول بنفس القيم اللي حطيتها في كود Apps Script !!
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMFRriABoh1m6QEpeta_Nn00DEgXiVSqFZF59lXOf5KAsyv2IMgtiSfnljZTUFeG9q/exec';
  const SECRET_KEY = 'rosto2026';

  function checkPwd(){
    const val = document.getElementById('pwd').value.trim();
    if (val === SECRET_KEY) {
      sessionStorage.setItem('leadsAuth', '1');
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadLeads();
    } else {
      document.getElementById('gateErr').style.display = 'block';
    }
  }

  document.getElementById('pwd').addEventListener('keydown', function(e){
    if (e.key === 'Enter') checkPwd();
  });

  function loadLeads(){
    document.getElementById('loading').style.display = 'block';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('leadsTable').style.display = 'none';

    fetch(APPS_SCRIPT_URL + '?key=' + encodeURIComponent(SECRET_KEY))
      .then(function(res){ return res.json(); })
      .then(function(leads){
        document.getElementById('loading').style.display = 'none';
        if (!Array.isArray(leads) || leads.length === 0) {
          document.getElementById('countBox').textContent = '0 ليد';
          document.getElementById('empty').style.display = 'block';
          return;
        }
        document.getElementById('countBox').textContent = leads.length + ' ليد مسجل';
        const body = document.getElementById('leadsBody');
        body.innerHTML = '';
        leads.forEach(function(lead){
          const tr = document.createElement('tr');
          const dateStr = lead.Date ? new Date(lead.Date).toLocaleString('ar-EG') : '';
          const phone = lead.Phone || '';
          const waLink = phone ? '<a href="https://wa.me/' + phone.replace(/[^0-9]/g,'') + '" target="_blank">' + phone + '</a>' : '';
          tr.innerHTML =
            '<td data-label="التاريخ">' + dateStr + '</td>' +
            '<td data-label="الاسم">' + (lead.Name || '') + '</td>' +
            '<td data-label="الهاتف">' + waLink + '</td>' +
            '<td data-label="الإيميل">' + (lead.Email || '') + '</td>' +
            '<td data-label="المدينة">' + (lead.City || '') + '</td>' +
            '<td data-label="عدد الوحدات">' + (lead.Units || '') + '</td>' +
            '<td data-label="ملاحظات">' + (lead.Question || '') + '</td>';
          body.appendChild(tr);
        });
        document.getElementById('leadsTable').style.display = 'table';
      })
      .catch(function(err){
        document.getElementById('loading').style.display = 'none';
        document.getElementById('countBox').textContent = 'حصل خطأ في التحميل';
        console.error(err);
      });
  }

  // لو المستخدم فتح الصفحة تاني في نفس الجلسة، متطلبش باسورد تاني
  if (sessionStorage.getItem('leadsAuth') === '1') {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadLeads();
  }
</script>
</body>
</html>
